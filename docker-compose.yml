services:
    web:
        build: .
        container_name: wbengine-skeleton-web
        depends_on:
            - db
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html/
            # Development PHP settings (error reporting without deprecations from legacy packages)
            - ./etc/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    db:
        container_name: wbengine-skeleton-db
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: wbengine_skeleton_app
            MYSQL_USER: dev_user
            MYSQL_PASSWORD: dev_password
        ports:
            # Local development only: not reachable from other machines.
            - "127.0.0.1:3306:3306"
        volumes:
            # The schema is imported on the first start of an empty database.
            - ./schemas:/docker-entrypoint-initdb.d:ro
