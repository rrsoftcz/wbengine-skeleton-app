<circle cx="20" cy="40" r="12" fill="#4f46e5"/><text x="20" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="66" y="44" font-size="16.5" font-weight="700" fill="#0f172a">Entry</text>
