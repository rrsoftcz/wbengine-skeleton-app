<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 716" width="400" height="716" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">One request from URL to HTML</title><desc id="d">One request from URL to HTML. 1: public/index.php loads Composer and the bootstrap. 2: the Application serves an application route or API route first, then resolves the language and the Site. 3: a gate checks access and the full-page cache; a cache hit sends the stored copy and skips straight to the response, a miss continues. 4: every Section and every Box is built: the Box calls its Model for database content and the Renderer processes a .tpl or .md source. 5: the section output is joined in the site layout. 6: the HTTP response is returned and a safe public copy is optionally stored.</desc>
