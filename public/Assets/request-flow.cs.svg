<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 716" width="400" height="716" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Jeden požadavek od URL po HTML</title><desc id="d">Jeden požadavek od URL po HTML. 1: public/index.php načte Composer a bootstrap. 2: Application nejdřív obslouží trasu aplikace nebo API, pak určí jazyk a Site. 3: brána zkontroluje přístup a cache celé stránky; zásah cache pošle uloženou kopii a přeskočí rovnou na odpověď, minutí pokračuje. 4: sestaví se každá Section a každý Box: Box zavolá svůj Model pro obsah z databáze a Renderer zpracuje zdroj .tpl nebo .md. 5: výstupy sekcí se složí v layoutu webu. 6: vrátí se odpověď HTTP a volitelně se uloží bezpečná veřejná kopie.</desc>
