services:
  tools:
    image: wbengine-modernization-php:latest
    working_dir: /app
    volumes:
      - ./:/app
      - ${WBENGINE_FRAMEWORK_PATH:-../wbengine}:/framework
    environment:
      COMPOSER: composer.smoke.json
      WBENGINE_SMOKE: '1'
    depends_on:
      db:
        condition: service_healthy
  web:
    image: wbengine-modernization-php:latest
    working_dir: /app
    command: ['php', '-S', '0.0.0.0:8080', '-t', 'public', 'tests/router.php']
    volumes:
      - ./:/app
      - ${WBENGINE_FRAMEWORK_PATH:-../wbengine}:/framework
    environment:
      WBENGINE_SMOKE: '1'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'php', '-r', "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 2s
      timeout: 2s
      retries: 20
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: smoke_root
      MYSQL_DATABASE: wbengine_skeleton_app
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    volumes:
      - ./schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -udev_user -pdev_password']
      interval: 2s
      timeout: 2s
      retries: 40
