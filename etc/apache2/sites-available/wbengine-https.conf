# Development vhost for https://wbengine.local with mkcert certificates.
# Enabled by docker-compose.https.yml. The certificates are generated locally and are
# not part of the repository (see etc/cert/README.md).
<VirtualHost *:443>
    ServerName wbengine.local
    DocumentRoot /var/www/html/public

    SSLEngine on
    SSLCertificateFile /etc/cert/fullchain.cer
    SSLCertificateKeyFile /etc/cert/wbengine.local.key

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # Required: public/.htaccess routes every request to index.php
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
