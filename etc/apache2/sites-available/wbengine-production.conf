# Production virtual host TEMPLATE for a bare-metal Apache install (mod_php or PHP-FPM).
# It is not used by the Docker setups. Copy it to /etc/apache2/sites-available/, replace every
# value after a "CHANGE:" comment, then:
#   a2enmod rewrite headers ssl && a2ensite <name> && apache2ctl configtest && systemctl reload apache2
# Apache does not allow comments after a directive, so every note sits on its own line.
# Certificates come from certbot (certbot --apache) or your own CA. Secrets never belong in this file:
# keep them in Settings.json or the environment of the PHP process (see docs/deploy-bare-metal.md).
#
# For PHP-FPM instead of mod_php, add inside the HTTPS VirtualHost (and a2enmod proxy_fcgi setenvif):
#   <FilesMatch "\.php$">
#       SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
#   </FilesMatch>

<VirtualHost *:80>
    # CHANGE: your host name
    ServerName example.com
    # CHANGE: the same host name
    Redirect permanent / https://example.com/
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        # CHANGE: your host name and the administrator contact
        ServerName example.com
        ServerAdmin webmaster@example.com
        # CHANGE: the public/ directory of the application (here and in the Directory block)
        DocumentRoot /var/www/wbengine-skeleton-app/public

        ErrorLog ${APACHE_LOG_DIR}/wbengine_error.log
        CustomLog ${APACHE_LOG_DIR}/wbengine_access.log combined

        <Directory /var/www/wbengine-skeleton-app/public>
            Options -Indexes +FollowSymLinks
            # Required: public/.htaccess routes every request to index.php
            AllowOverride All
            Require all granted
        </Directory>

        SSLEngine on
        # CHANGE: the certificate and key of your host
        SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    </VirtualHost>
</IfModule>
