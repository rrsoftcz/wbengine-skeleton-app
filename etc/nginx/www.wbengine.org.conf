# Production Nginx virtual hosts for wbengine.org.
# For first-time certificate issuance, start with the HTTP server block only,
# create /var/www/letsencrypt, issue the certificate, then enable all blocks.
# Obtain one Let's Encrypt certificate covering both names:
#   certbot certonly --webroot -w /var/www/letsencrypt \
#     -d www.wbengine.org -d wbengine.org
# Adjust the application root and PHP-FPM socket to the host.

server {
    listen 80;
    listen [::]:80;
    server_name wbengine.org www.wbengine.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://www.wbengine.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wbengine.org;

    ssl_certificate /etc/letsencrypt/live/www.wbengine.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wbengine.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.wbengine.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wbengine.org;

    root /var/www/wbengine-skeleton-app/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/www.wbengine.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wbengine.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # The application adds trailing slashes to public pages. Keep API methods
    # untouched because redirecting a POST can discard its request body.
    location = / {
        rewrite ^ /index.php?link=front last;
    }

    location / {
        if ($uri !~ "^/api(/|$)") {
            rewrite ^([^.]*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/ @wbengine;
    }

    location @wbengine {
        rewrite ^/(.*)$ /index.php?link=$1 last;
    }

    # Only the front controller may execute PHP. The internal flag prevents
    # direct requests to /index.php while allowing the rewrites above.
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    # Do not expose hidden files, application source, configuration or SQL.
    location ~ (^|/)\. {
        deny all;
    }

    location ~* \.(?:sql|tpl|ini|log|conf|lock|dist)$ {
        deny all;
    }

    location ~ ^/(?:src|vendor|schemas|bin|etc|tests)(?:/|$) {
        deny all;
    }
}
