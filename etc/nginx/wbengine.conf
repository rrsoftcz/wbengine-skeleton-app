server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # The front page
    location = / {
        rewrite ^ /index.php?link=front last;
    }

    # Pages and API: everything that is not a real file goes to index.php
    location / {
        # Pages need a trailing slash. The API does not: a redirect would turn a POST into a GET.
        if ($uri !~ "^/api(/|$)") {
            rewrite ^([^.]*[^/])$ $1/ permanent;
        }
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?link=$1 last;
        }
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Never serve configuration, templates or sources
    location ~ ^/(src|vendor|schemas|bin|etc)/ { deny all; }
}
