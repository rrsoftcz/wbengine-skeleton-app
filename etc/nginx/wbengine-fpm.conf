# Nginx server block for a bare-metal install with PHP-FPM on a unix socket.
# Derived from wbengine.conf (the Docker development setup, which uses fastcgi_pass php:9000).
# Copy it to /etc/nginx/sites-available/, replace the three values marked CHANGE, enable it and run nginx -t.
# For HTTPS add a "listen 443 ssl" server block with your certificate (see www.wbengine.org.conf) and keep this
# one as a redirect. Only the front controller public/index.php executes PHP.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;                       # CHANGE: your host name
    root /var/www/wbengine-skeleton-app/public;    # CHANGE: the public/ directory of the application
    index index.php;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The front page
    location = / {
        rewrite ^ /index.php?link=front last;
    }

    # Pages and API: everything that is not a real file goes to index.php
    location / {
        # Pages need a trailing slash. The API does not: a redirect would turn a POST into a GET.
        if ($uri !~ "^/api(/|$)") {
            rewrite ^([^.]*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/ @wbengine;
    }

    location @wbengine {
        rewrite ^/(.*)$ /index.php?link=$1 last;
    }

    # Only the front controller executes PHP. "internal" blocks direct requests to /index.php
    # while the rewrites above still reach it.
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # CHANGE: the socket of your PHP-FPM pool
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve hidden files, configuration, templates, sources or SQL.
    location ~ (^|/)\. { deny all; }
    location ~* \.(?:sql|tpl|ini|log|conf|lock|dist)$ { deny all; }
    location ~ ^/(?:src|vendor|schemas|bin|etc|tests)(?:/|$) { deny all; }
}
