server {
    listen 80;
    listen [::]:80;
    server_name www.wbengine.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://www.wbengine.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wbengine.org;

    ssl_certificate /etc/letsencrypt/live/www.wbengine.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wbengine.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Apache in the container only sees plain HTTP and builds absolute redirects such as /blog to /blog/
        # with http://. Rewrite them to the public HTTPS address.
        proxy_redirect http://$host/ https://$host/;
        proxy_read_timeout 60s;
    }
}
