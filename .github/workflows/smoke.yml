name: WBengine 4.1 HTTP smoke
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      WBENGINE_FRAMEWORK_PATH: ${{ github.workspace }}/framework
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      - uses: actions/checkout@v7
        with:
          repository: rrsoftcz/wbengine
          ref: v5.0.0
          path: framework
      - name: Build test PHP image
        run: docker compose -p wbengine-modernization -f framework/docker-compose.yml build php
      - name: Verify released Composer package profile
        working-directory: app
        run: |
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml run --no-deps --rm -e COMPOSER=composer.json tools composer validate --no-check-publish --strict
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml run --no-deps --rm -e COMPOSER=composer.json tools composer install --no-dev --no-interaction --prefer-dist --no-scripts --dry-run
      - name: Prepare isolated test application
        working-directory: app
        run: |
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml run --rm tools php tests/setup-smoke.php
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml run --rm tools composer install --no-dev --no-interaction --prefer-dist
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml run --rm tools php tests/seed-smoke.php
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml up -d --wait web
      - name: Verify reversible content migration on temporary source copies
        working-directory: app
        run: docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml run --rm tools php tests/content-migration-smoke.php
      - name: Verify the Google Analytics setting gates the consent banner
        working-directory: app
        run: docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml run --rm tools php tests/analytics-setting.php
      - name: Verify dependency profile and clear smoke caches
        working-directory: app
        run: |
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml exec -T web php tests/dependency-profile.php --without-texy
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml exec -T web php tests/reset-smoke-cache.php
      - name: Verify installed Composer binaries
        working-directory: app
        run: |
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml exec -T web php vendor/bin/wbengine.php help
          docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml exec -T web php vendor/bin/migrate-content.php --help
      - name: Exercise real HTTP requests
        working-directory: app
        run: docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml exec -T web php tests/http-smoke.php
      - name: Server logs
        if: failure()
        working-directory: app
        run: docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml logs --tail 60 web
      - name: Stop only the smoke environment
        if: always()
        working-directory: app
        run: docker compose -p wbengine-skeleton-smoke -f compose.smoke.yml down --remove-orphans
